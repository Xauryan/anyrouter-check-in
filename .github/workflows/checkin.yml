name: AnyRouter 自动签到
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 开启调试模式（截图 artifact、详细日志）
        required: false
        default: false
        type: boolean

jobs:
  checkin:
    name: 签到批次 ${{ matrix.batch_number }} / 3
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - batch_index: 0
            batch_number: 1
          - batch_index: 1
            batch_number: 2
          - batch_index: 2
            batch_number: 3
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      CHECKIN_RESULTS_FILE: batch_results/checkin_results.json
      CHECKIN_BATCH_INDEX: ${{ matrix.batch_index }}
      CHECKIN_BATCH_COUNT: 3
      CHECKIN_SCREENSHOT_ARTIFACT: checkin-screenshots-${{ github.run_id }}-batch-${{ matrix.batch_number }}
      DEBUG_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true' && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: "latest"

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@v5
      id: uv-cache
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 安装依赖
      run: |
        uv sync --frozen
        echo "✅ 环境初始化完成"

    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont \
          fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf

    - name: 缓存 CloakBrowser 二进制
      uses: actions/cache@v5
      id: cloakbrowser-cache
      with:
        path: ~/.cloakbrowser
        key: ${{ runner.os }}-cloakbrowser-v1
        restore-keys: |
          ${{ runner.os }}-cloakbrowser-

    - name: 安装 CloakBrowser
      run: |
        uv run python -m cloakbrowser install
        echo "✅ CloakBrowser 安装完成"

    - name: 恢复批次余额历史缓存
      uses: actions/cache@v5
      with:
        path: balance_hash.txt
        key: balance-hash-${{ github.ref_name }}-v2-batch-${{ matrix.batch_index }}-${{ github.run_id }}
        restore-keys: |
          balance-hash-${{ github.ref_name }}-v2-batch-${{ matrix.batch_index }}-

    - name: 恢复批次浏览器 Profile 缓存
      uses: actions/cache@v5
      with:
        path: .browser_profiles
        key: browser-profiles-${{ runner.os }}-v3-batch-${{ matrix.batch_index }}-${{ github.run_id }}
        restore-keys: |
          browser-profiles-${{ runner.os }}-v3-batch-${{ matrix.batch_index }}-
          browser-profiles-${{ runner.os }}-v2-
          browser-profiles-${{ runner.os }}-v1

    - name: 记录 Runner 出口指纹
      shell: bash
      run: |
        runner_ip="$(curl --retry 2 --retry-delay 2 --max-time 10 -fsS https://api.ipify.org || true)"
        if [[ "${runner_ip}" =~ ^[0-9A-Fa-f:.]+$ ]]; then
          fingerprint="$(printf '%s:%s' "${GITHUB_RUN_ID}" "${runner_ip}" | sha256sum | cut -c1-12)"
        else
          fingerprint="unavailable"
        fi
        echo "CHECKIN_EGRESS_FINGERPRINT=${fingerprint}" >> "${GITHUB_ENV}"
        echo "Batch ${{ matrix.batch_number }} Runner egress fingerprint: ${fingerprint}"

    - name: 配置代理
      env:
        PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
        PROXY_TEST_URL: https://www.google.com/generate_204
        MIHOMO_VERSION: v1.19.27
        PROXY_REQUIRED: false
      run: bash scripts/setup_mihomo_proxy.sh

    - name: 执行批次签到
      id: checkin
      continue-on-error: true
      env:
        DEBUG_MODE: ${{ env.DEBUG_MODE }}
        CHECKIN_HEADLESS: false
        CHECKIN_HUMANIZE: true
        CHECKIN_WAIT_TIMEOUT_MS: 120000
        CHECKIN_LOGIN_MAX_ATTEMPTS: 2
        CHECKIN_LOGIN_RETRY_DELAY_SECONDS: 15
        CHECKIN_USER_INFO_MAX_ATTEMPTS: 3
        CHECKIN_USER_INFO_RETRY_DELAY_SECONDS: 3
        CHECKIN_ACCOUNT_DELAY_SECONDS: 5
        CHECKIN_FAILURE_COOLDOWN_SECONDS: 30
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        BARK_KEY: ${{ secrets.BARK_KEY }}
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
      run: |
        xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run checkin.py

    - name: 上传批次结果
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: checkin-result-${{ github.run_id }}-batch-${{ matrix.batch_index }}
        path: ${{ env.CHECKIN_RESULTS_FILE }}
        if-no-files-found: error
        retention-days: 14

    - name: 上传批次调试截图
      if: always() && env.DEBUG_MODE == 'true'
      env:
        HTTP_PROXY: ''
        HTTPS_PROXY: ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.CHECKIN_SCREENSHOT_ARTIFACT }}
        path: checkin_screenshots/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14

    - name: 停止代理
      if: always()
      run: bash scripts/stop_mihomo_proxy.sh

  summary:
    name: 汇总签到结果
    if: always()
    needs: checkin
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
    steps:
    - uses: actions/checkout@v6

    - name: 下载全部批次结果
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: checkin-result-${{ github.run_id }}-batch-*
        path: batch_results
        merge-multiple: false

    - name: 合并批次结果
      id: merge
      run: |
        python3 scripts/merge_checkin_reports.py \
          --input-dir batch_results \
          --output checkin_results.json \
          --expected-batches 3 \
          --github-output "${GITHUB_OUTPUT}"

    - name: 上传合并结果
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: checkin-results-${{ github.run_id }}
        path: checkin_results.json
        if-no-files-found: error
        retention-days: 14

    - name: 发布合并结果摘要
      if: always()
      env:
        CHECKIN_STEP_OUTCOME: ${{ steps.merge.outputs.step_outcome }}
      run: |
        python3 scripts/render_checkin_summary.py \
          --input checkin_results.json \
          --output "${GITHUB_STEP_SUMMARY}" \
          --step-outcome "${CHECKIN_STEP_OUTCOME}"
        echo "三个批次的合并结果已发布到 GitHub Actions Summary"

    - name: 校验整体签到结果
      if: always()
      env:
        CHECKIN_COMPLETE: ${{ steps.merge.outputs.complete }}
        CHECKIN_SUCCESS_COUNT: ${{ steps.merge.outputs.success_count }}
      run: |
        if [[ "${CHECKIN_COMPLETE}" != "true" ]]; then
          echo "::error::批次结果缺失或不完整"
          exit 1
        fi
        if [[ "${CHECKIN_SUCCESS_COUNT}" == "0" ]]; then
          echo "::error::所有账号签到均失败"
          exit 1
        fi
